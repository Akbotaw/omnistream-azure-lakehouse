# Production Sink configuration: stream CDC events directly to Apache Kafka
debezium.sink.type=kafka
debezium.sink.kafka.producer.bootstrap.servers=kafka:9092
debezium.sink.kafka.producer.key.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.sink.kafka.producer.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# PostgreSQL Source Connector (WAL Logical Replication)
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=1000
debezium.source.database.hostname=postgres_oltp
debezium.source.database.port=5432
debezium.source.database.user=cdc_user
debezium.source.database.password=cdc_password
debezium.source.database.dbname=omnistream_oltp

# Topic prefix & Airbnb tables to capture
# Kafka topics will be named: omnistream.airbnb.<table_name>
debezium.source.topic.prefix=omnistream
debezium.source.table.include.list=airbnb.listings,airbnb.bookings,airbnb.payments
debezium.source.plugin.name=pgoutput
debezium.source.slot.name=omnistream_cdc_slot

# Emit clean JSON payloads
debezium.format.key=json
debezium.format.key.schemas.enable=false
debezium.format.value=json
debezium.format.value.schemas.enable=false
debezium.source.decimal.handling.mode=double
